version: "3.9"

services:
  mssql-server:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: fair-mssql
    environment:
      ACCEPT_EULA: "Y"
      SA_PASSWORD: ${SA_PASSWORD}
    ports:
      - "${SQL_PORT}:1433"
    volumes:
      - fair-mssql-data:/var/opt/mssql
    networks:
      - fair-network

  fair-api:
    container_name: fair-api
    build:
      context: .
      dockerfile: Dockerfile
    depends_on:
      - mssql-server
    environment:
      ASPNETCORE_ENVIRONMENT: ${ASPNETCORE_ENVIRONMENT}
      ASPNETCORE_URLS: ${ASPNETCORE_URLS}
      ConnectionStrings__FAIRconnection: ${CONNECTION_STRING}
    ports:
      - "${API_HTTP_PORT}:80"
      - "${API_HTTPS_PORT}:443"
    networks:
      - fair-network

volumes:
  fair-mssql-data:

networks:
  fair-network:
    driver: bridge
